<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5f5a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduCore" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="/educore-logo.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>EduCore Manager | Smart classroom management</title>
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; gap: .8rem; align-content: center; background: #f5faf8; color: #0f5f5a; font-family: Arial, sans-serif; }
      #boot-loader__mark { width: 3.2rem; height: 3.2rem; position: relative; border: .22rem solid rgba(15,95,90,.16); border-top-color: #0f5f5a; border-right-color: #d8a83e; border-radius: 50%; animation: educore-boot-spin 900ms linear infinite; }
      #boot-loader__mark::after { content: ''; position: absolute; inset: .75rem; border-radius: 50%; background: linear-gradient(145deg, #0f5f5a 0 48%, #d8a83e 49% 100%); opacity: .9; }
      #boot-loader strong { margin-top: .1rem; font-size: 1.25rem; letter-spacing: .02em; }
      #boot-loader small { color: rgba(24,43,54,.62); font-size: .85rem; }
      #boot-loader__en { display: none; }
      #boot-loader.is-en #boot-loader__ar { display: none; }
      #boot-loader.is-en #boot-loader__en { display: inline; }
      @keyframes educore-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-loader__mark { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-live="polite">
        <div id="boot-loader__mark" aria-hidden="true"></div>
        <strong>EduCore</strong>
        <small id="boot-loader__ar">جاري تحميل المنصة…</small>
        <small id="boot-loader__en">Loading EduCore…</small>
      </div>
    </div>
    <script>
      (() => {
        try {
          const isEnglish = localStorage.getItem('educore_locale') === 'en';
          const loader = document.getElementById('boot-loader');
          document.documentElement.lang = isEnglish ? 'en' : 'ar';
          document.documentElement.dir = isEnglish ? 'ltr' : 'rtl';
          loader?.classList.toggle('is-en', isEnglish);
        } catch (_) { /* The application will set locale after boot. */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
